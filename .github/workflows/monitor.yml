name: Deal Monitor

on:

  schedule:

    - cron: "*/15 * * * *"


  workflow_dispatch:



jobs:

  monitor:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Python

      uses: actions/setup-python@v5

      with:

        python-version: "3.12"



    - name: Install

      run: |

        pip install -r requirements.txt



    - name: Run monitor

      env:

        EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

        EMAIL_TO: ${{ secrets.EMAIL_TO }}

      run: |

        python monitor.py
